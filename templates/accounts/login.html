{% extends 'base.html' %}
{% block title %}Login | CalmStage{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200 mt-6">
    <h1 class="text-2xl font-bold text-teal-900 mb-1">Welcome Back</h1>
    <p class="text-sm text-slate-500 mb-6">Log in to access your CalmStage dashboard.</p>

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div>
            <label for="id_username" class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
            <input type="text" name="username" id="id_username" required
                   class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-600 text-sm">
        </div>

        <div>
            <label for="id_password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
            <input type="password" name="password" id="id_password" required
                   class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-600 text-sm">
        </div>

        <button type="submit" class="w-full bg-teal-800 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-lg transition">
            Log In
        </button>
    </form>

    <p class="text-center text-sm text-slate-600 mt-5">
        Don't have an account? <a href="{% url 'register' %}" class="text-teal-700 font-semibold hover:underline">Register now</a>
    </p>
</div>
{% endblock %}
